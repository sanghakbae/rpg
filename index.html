<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<title>미니 MMORPG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: 'Apple SD Gothic Neo', 'Gothic A1', sans-serif; user-select: none; }
  canvas#game { display: block; width: 100vw; height: 100vh; }

  .panel { background: rgba(10,14,22,.85); border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; color: #ddd; }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 5px; }

  /* ===== 구글 로그인 ===== */
  #loginScreen { position: fixed; inset: 0; background: radial-gradient(ellipse at center, #1a2233 0%, #0a0e16 70%);
    z-index: 101; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  #loginScreen h1 { color: #ffd700; font-size: 42px; letter-spacing: 6px; text-shadow: 0 0 24px rgba(255,215,0,.35); }
  #googleLoginBtn { display: flex; align-items: center; padding: 13px 34px; font-size: 16px; font-weight: bold;
    background: #fff; color: #3c4043; border-radius: 8px; }
  #googleLoginBtn:hover { box-shadow: 0 0 22px rgba(255,255,255,.4); transform: translateY(-2px); }

  /* ===== 캐릭터 생성 ===== */
  #create { position: fixed; inset: 0; background: radial-gradient(ellipse at center, #1a2233 0%, #0a0e16 70%);
    z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  #create h1 { color: #ffd700; font-size: 42px; letter-spacing: 6px; text-shadow: 0 0 24px rgba(255,215,0,.35); }
  #create h2 { color: #8899aa; font-size: 14px; font-weight: normal; margin-top: -18px; }
  #nameInput { width: 300px; padding: 12px 16px; font-size: 17px; text-align: center;
    background: rgba(255,255,255,.06); border: 1px solid #445; border-radius: 8px; color: #fff; outline: none; }
  #nameInput:focus { border-color: #ffd700; }
  #classGrid { display: flex; gap: 14px; }
  .ccard { width: 150px; padding: 16px 10px; background: rgba(255,255,255,.04); border: 2px solid #334;
    border-radius: 12px; text-align: center; cursor: pointer; transition: all .15s; }
  .ccard:hover { transform: translateY(-4px); border-color: #7788aa; }
  .ccard.sel { border-color: #ffd700; background: rgba(255,215,0,.08); box-shadow: 0 0 20px rgba(255,215,0,.25); }
  .cicon { font-size: 40px; margin-bottom: 6px; }
  .cname { color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 4px; }
  .cweap { color: #ffd700; font-size: 12px; margin-bottom: 8px; }
  .cstat { color: #99a; font-size: 11px; line-height: 1.6; }
  .cstat b { color: #ccd; }
  #startBtn { padding: 13px 60px; font-size: 17px; font-weight: bold; background: linear-gradient(#c9a227, #8f6f14);
    color: #fff; letter-spacing: 3px; }
  #startBtn:hover { filter: brightness(1.15); }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; color: #888; z-index: 99; font-size: 15px; white-space: pre-line; text-align: center; padding: 20px; }

  /* ===== HUD ===== */
  #hud { position: fixed; top: 12px; left: 12px; width: 235px; padding: 10px 12px; z-index: 10; font-size: 13px; }
  #hud .toprow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  #hud .lv { color: #ffd700; font-size: 18px; font-weight: bold; }
  #hud .cls { font-size: 11px; color: #7fc7ff; }
  #hud .name { color: #fff; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .barwrap { height: 14px; background: #222; border-radius: 7px; overflow: hidden; margin-bottom: 5px; border: 1px solid #333; }
  .bar { height: 100%; width: 100%; transition: width .2s; }
  #hpbar { background: linear-gradient(#e74c3c, #a93226); }
  #expbar { background: linear-gradient(#3498db, #21618c); }
  .bartext { font-size: 11px; color: #ccc; text-align: right; margin-top: -15px; margin-bottom: 6px; position: relative; }
  #stats { color: #aaa; font-size: 12px; line-height: 1.55; }
  #stats b { color: #eee; }
  #goldRow { margin-top: 6px; padding-top: 6px; border-top: 1px solid #333; color: #ffd700; font-weight: bold; }
  #btnRow { display: flex; gap: 6px; margin-top: 8px; }
  #btnRow button { flex: 1; padding: 7px 0; font-size: 11.5px; font-weight: bold;
    background: linear-gradient(#c9a227, #8f6f14); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  #btnRow button:hover { filter: brightness(1.18); }

  /* 인벤토리 */
  #invPanel { position: fixed; left: 12px; top: 218px; width: 235px; padding: 8px; z-index: 10; }
  #invPanel h3 { font-size: 11px; color: #888; margin: 2px 0 6px 2px; letter-spacing: 1px; }
  #equipGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 8px; }
  .eslot { height: 36px; background: rgba(255,255,255,.05); border: 1px dashed #555; border-radius: 5px;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           font-size: 10px; cursor: pointer; text-align: center; line-height: 1.25; overflow: hidden; padding: 0 2px; }
  .eslot .slbl { font-size: 8px; color: #667; letter-spacing: 1px; }
  .eslot:hover { border-color: #ffd700; }
  #invGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .islot { aspect-ratio: 1; background: rgba(255,255,255,.06); border: 1px solid #444; border-radius: 5px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .islot:hover { border-color: #ffd700; }
  .islot .ic { font-size: 15px; font-weight: bold; pointer-events: none; }

  /* 핫바 */
  #hotbar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
  .hslot { width: 58px; height: 58px; position: relative; border-radius: 9px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hslot .key { position: absolute; top: 3px; left: 6px; font-size: 10px; color: #888; }
  .hslot .ic2 { font-size: 19px; }
  .hslot .nm { font-size: 9.5px; color: #aab; margin-top: 2px; }
  .hslot .cd { position: absolute; inset: 0; background: rgba(0,0,0,.65); border-radius: 9px;
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: bold; }
  .hslot.locked { opacity: .45; }

  /* 스킬샵 / 퀘스트 패널 */
  .sidepanel { position: fixed; right: 190px; top: 12px; width: 320px; max-height: calc(100vh - 160px); z-index: 15;
    display: none; flex-direction: column; }
  .sidepanel.open { display: flex; }
  .sidepanel header { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #333; }
  .sidepanel header b { flex: 1; color: #ffd700; font-size: 15px; letter-spacing: 2px; }
  .sidepanel header button { background: none; color: #888; font-size: 16px; }
  .spbody { overflow-y: auto; padding: 8px; }
  .spbody::-webkit-scrollbar { width: 5px; } .spbody::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  .srow { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 7px; margin-bottom: 6px; background: rgba(255,255,255,.04); }
  .srow .si { font-size: 24px; width: 34px; text-align: center; }
  .srow .sm { flex: 1; }
  .srow .st { color: #fff; font-size: 13px; font-weight: bold; }
  .srow .sd { color: #8899aa; font-size: 11px; line-height: 1.4; margin-top: 2px; }
  .srow .slv { color: #7fc7ff; font-size: 11px; margin-left: 4px; }
  .buyBtn, .claimBtn { padding: 6px 10px; font-size: 12px; background: linear-gradient(#c9a227, #8f6f14); color: #fff; white-space: nowrap; }
  .buyBtn:disabled, .claimBtn:disabled { background: #444; color: #777; cursor: not-allowed; }
  .claimBtn.ready { background: linear-gradient(#27ae60, #1e8449); animation: glow 1.2s infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 12px rgba(46,204,113,.8); } }
  .qbar { height: 5px; background: #222; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .qbar div { height: 100%; background: #27ae60; }
  .qdone .st { text-decoration: line-through; color: #7fa; }

  #minimap { position: fixed; top: 12px; right: 12px; z-index: 10; opacity: .92; }

  /* 채팅 */
  #chatBox { position: fixed; left: 12px; bottom: 12px; width: 380px; z-index: 10; }
  #chatLog { height: 140px; overflow-y: auto; padding: 8px 10px; font-size: 12px; line-height: 1.55; }
  #chatLog::-webkit-scrollbar { width: 5px; } #chatLog::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  #chatLog .sys { color: #ffd700; } #chatLog .sysq { color: #7fe3a0; }
  #chatLog .nick { color: #7fc7ff; font-weight: bold; }
  #chatInput { width: 100%; background: rgba(0,0,0,.6); border: none; border-top: 1px solid #333; color: #eee;
    padding: 8px 10px; font-size: 13px; outline: none; border-radius: 0 0 8px 8px; }

  #help { position: fixed; bottom: 86px; right: 12px; z-index: 9; padding: 8px 12px; font-size: 11px; color: #999; line-height: 1.7; }
  #help b { color: #ccc; }
  #bossAlert { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 20;
    padding: 10px 28px; font-size: 17px; font-weight: bold; color: #ff6b6b; display: none;
    animation: pulse 1s infinite; letter-spacing: 2px; }
  /* 획득 토스트 */
  #toasts { position: fixed; right: 190px; bottom: 100px; z-index: 25; display: flex; flex-direction: column-reverse; gap: 6px; pointer-events: none; }
  .toast { padding: 7px 12px; font-size: 12px; border-radius: 6px; background: rgba(8,12,20,.92);
    border-left: 3px solid #ffd700; color: #eee; animation: tin .18s ease-out; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .toast.sysq { border-left-color: #2ecc71; }
  .toast.fade { opacity: 0; transition: opacity .5s; }
  @keyframes tin { from { transform: translateX(30px); opacity: 0; } }

  /* 가방 개수 + 플래시 */
  #bagCount { float: right; color: #ffd700; }
  #invPanel.flash { animation: invflash 1s ease-out; }
  @keyframes invflash { 0% { box-shadow: 0 0 0 3px #ffd700, 0 0 24px rgba(255,215,0,.8); } 100% { box-shadow: none; } }

  /* 아이템 등급 테두리 */
  .islot { position: relative; }
  .islot[data-r="uncommon"] { border-color: #2ecc71; box-shadow: inset 0 0 8px rgba(46,204,113,.3); }
  .islot[data-r="rare"] { border-color: #3498db; box-shadow: inset 0 0 8px rgba(52,152,219,.35); }
  .islot[data-r="epic"] { border-color: #9b59b6; box-shadow: inset 0 0 8px rgba(155,89,182,.35); }
  .islot[data-r="legend"] { border-color: #ffd700; box-shadow: inset 0 0 10px rgba(255,215,0,.45); }
  .islot[data-r="unique"] { border-color: #ff4d4d; box-shadow: inset 0 0 12px rgba(255,77,77,.5), 0 0 8px rgba(255,77,77,.4); }
  .eslot[data-r="uncommon"] { border-color: #2ecc71; border-style: solid; }
  .eslot[data-r="rare"] { border-color: #3498db; border-style: solid; }
  .eslot[data-r="epic"] { border-color: #9b59b6; border-style: solid; }
  .eslot[data-r="legend"] { border-color: #ffd700; border-style: solid; }
  .eslot[data-r="unique"] { border-color: #ff4d4d; border-style: solid; box-shadow: 0 0 8px rgba(255,77,77,.4); }
  .islot .ic { font-size: 17px; }

  /* 효과 */
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading">Firebase 연결 중...</div>

<div id="create" style="display:none">
  <h1>미니 MMORPG</h1>
  <h2>캐릭터를 만들어 모험을 시작하세요</h2>
  <input id="nameInput" maxlength="12" placeholder="캐릭터 이름 입력...">
  <div id="classGrid"></div>
  <button id="startBtn">모험 시작</button>
</div>

<div id="hud" class="panel">
  <div class="toprow">
    <span class="lv">Lv <span id="uiLv">1</span></span><span class="cls" id="uiCls"></span><span class="name" id="uiName"></span>
  </div>
  <div class="barwrap"><div class="bar" id="hpbar"></div></div>
  <div class="bartext" id="hpText"></div>
  <div class="barwrap"><div class="bar" id="expbar"></div></div>
  <div class="bartext" style="margin-top:-13px;margin-bottom:2px;" id="expText"></div>
  <div id="stats">공격 <b id="uiAtk"></b> · 방어 <b id="uiDef"></b> · 치명타 <b id="uiCrit"></b>% · 속도 <b id="uiSpd"></b></div>
  <div id="goldRow">💰 <span id="uiGold">0</span> G</div>
  <div id="btnRow">
    <button id="shopBtn">스킬샵 [B]</button>
    <button id="questBtn">퀘스트 [Q]</button>
  </div>
</div>

<div id="invPanel" class="panel">
  <h3>장비 [클릭: 해제]</h3>
  <div id="equipGrid"></div>
  <h3>가방 [클릭: 장착/사용] <span id="bagCount">0/18</span></h3>
  <div id="invGrid"></div>
</div>

<div id="shopPanel" class="sidepanel panel">
  <header><b>⚔ 스킬 샵</b><button data-close="shopPanel">✕</button></header>
  <div class="spbody" id="shopBody"></div>
</div>

<div id="questPanel" class="sidepanel panel">
  <header><b>📜 퀘스트</b><button data-close="questPanel">✕</button></header>
  <div class="spbody" id="questBody"></div>
</div>

<div id="hotbar">
  <div class="hslot panel" id="hb1"><span class="key">1</span><span class="ic2">✦</span><span class="nm">-</span><div class="cd" style="display:none"></div></div>
  <div class="hslot panel" id="hb2"><span class="key">2</span><span class="ic2">💚</span><span class="nm">회복술</span><div class="cd" style="display:none"></div></div>
</div>

<canvas id="minimap" width="160" height="120" class="panel"></canvas>

<div id="chatBox">
  <div id="chatLog" class="panel"></div>
  <input id="chatInput" maxlength="80" placeholder="Enter 키로 채팅...">
</div>

<div id="help" class="panel">
  <b>이동</b> WASD/화살표/빈 곳 클릭<br>
  <b>공격</b> Space/몬스터 클릭 · <b>스킬</b> 1·2 · <b>샵</b> B · <b>퀘스트</b> Q<br>
  루팅은 아이템에 접근 시 자동
</div>

<div id="bossAlert" class="panel">⚔ 보스 「오크 대족장」 출현! ⚔</div>

<div id="onlineCnt" class="panel" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;padding:5px 14px;font-size:12px;color:#9fd;">🗺 <b id="mapName">초원</b> · 🟢 <b id="ocN">1</b>명</div>

<div id="mapFade" style="position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:50;"></div>

<div id="deadOv" class="panel" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:30;background:rgba(60,0,0,.5);">
  <div style="font-size:34px;color:#ff6b6b;font-weight:bold;text-shadow:0 0 18px rgba(255,0,0,.6);">💀 쓰러졌습니다...</div>
  <div style="font-size:15px;color:#ccc;"><b id="deadCnt" style="color:#ffd700;font-size:22px;">30:00</b> 후 자동 부활</div>
  <button id="reviveBtn" style="padding:12px 30px;font-size:15px;font-weight:bold;background:linear-gradient(#c9a227,#8f6f14);color:#fff;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.5);">💎 즉시 부활 (<span id="reviveCost">100</span> G)</button>
  <div style="font-size:11px;color:#889;">즉시 부활하면 자리에서 일어납니다</div>
</div>

<div id="toasts"></div>

<script src="firebase-config.js?v=14"></script>
<script type="module" src="game.js?v=14"></script>
</body>
</html>
