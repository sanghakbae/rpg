<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>VARCO GLB → 8방향 스프라이트 베이커</title>
<style>
  body { margin:0; background:#0d1420; color:#ddd; font:13px/1.5 sans-serif; padding:14px; }
  h1 { font-size:16px; color:#ffd700; margin:0 0 8px; }
  #log { white-space:pre-wrap; color:#9ab; background:#0a0e16; padding:8px; border-radius:6px; max-height:180px; overflow:auto; }
  .sheet { display:block; margin:10px 0; background:
    repeating-conic-gradient(#1a2230 0 25%, #131a26 0 50%) 0 0/32px 32px; border:1px solid #334; max-width:100%; image-rendering:auto; }
  button { padding:8px 14px; background:#2b3547; color:#fff; border:0; border-radius:6px; cursor:pointer; margin-right:6px; }
  label { margin-right:12px; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<h1>VARCO GLB → 8방향 스프라이트 시트</h1>
<div>
  <label>셀 크기 <input id="fr" type="number" value="512" style="width:70px"></label>
  <label>카메라 고도(°) <input id="elev" type="number" value="26" style="width:60px"></label>
  <label>정면 보정(°) <input id="yawFix" type="number" value="180" style="width:60px"></label> <!-- VARCO 모델은 +Z가 정면: 180° 보정 -->
  <label>모델 높이 배율 <input id="hscale" type="number" value="1" step="0.05" style="width:60px"></label>
  <button id="run">전부 굽기</button>
  <button id="one">첫 모델만 미리보기</button>
  <span id="st"></span>
</div>
<div id="log"></div>
<div id="out"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* 파일 → 게임 내 키. 영웅은 직업명, 몬스터는 mob_ 접두 */
const JOBS = [
  ['../assets/glb/Cartoon Red Knight.glb', 'warrior'],
  ['../assets/glb/Green Hooded Archer.glb', 'archer'],
  ['../assets/glb/Stylized Assassin Figure.glb', 'rogue'],
  ['../assets/glb/Purple Lich.glb', 'mob_lich'],
  ['../assets/glb/Stylized Purple Wizard.glb', 'mage'],
  ['../assets/glb/Green Crystal Slime.glb', 'mob_slime'],
  ['../assets/glb/Green Orc Character.glb', 'mob_goblin'], /* VARCO 자동 이름은 orc지만 고블린 프롬프트 결과물 */
  ['../assets/glb/Low Poly Dire Wolf.glb', 'mob_wolf', 0], /* 3번째: 모델별 추가 yaw 보정(°) — 측면 이미지로 만든 모델은 정면이 ±90° 틀어질 수 있음 */
  /* 애니메이션 모델(리깅 포함): 상태별 프레임을 행으로 굽는다. anim: 상태→클립 이름 정규식, frames: 상태별 프레임 수 */
  { url: '../assets/glb/Orc_Skull.gltf', key: 'mob_orc', fr: 256, yaw: 0, hscale: 1,
    anim: { idle: /^Idle$/i, walk: /^Walk$/i, attack: /^Weapon$|^Punch$/i, hurt: /^HitReact$/i, death: /^Death$/i } },
  { url: '../assets/glb/Skeleton_Warrior.glb', key: 'mob_skeleton', fr: 256, yaw: 0, hscale: 1,
    anim: { idle: /^Idle$|^Idle_A$|2H_Melee_Idle/i, walk: /^Walking_A$|^Walking_B$|^Walk$/i, attack: /1H_Melee_Attack_Slice_Diagonal|1H_Melee_Attack_Chop|2H_Melee_Attack_Slice/i, hurt: /^Hit_A$/i, death: /^Death_A$/i } },
];
const ANIM_FRAMES = { idle: 4, walk: 6, attack: 6, hurt: 2, death: 4 };
const ANIM_ORDER = ['idle', 'walk', 'attack', 'hurt', 'death'];
const SAVE_URL = 'http://localhost:8124/save';
const log = m => { const el = document.getElementById('log'); el.textContent += m + '\n'; el.scrollTop = 1e9; };
const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
/* 게임 후처리(좌상단 림라이트)와 방향을 맞춘 조명 */
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a4a5a, 1.05));
const key = new THREE.DirectionalLight(0xfff4e0, 1.35); key.position.set(-1.2, 2.2, 1.6); scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd8ff, .45); fill.position.set(1.5, 1, -1); scene.add(fill);
const loader = new GLTFLoader();

function normalize(root, hscale) {
  /* 발바닥 y=0, 가로 중심 0, 키 = 1 유닛 */
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  const s = (1 / size.y) * hscale;
  root.scale.setScalar(s);
  root.position.set(-ctr.x * s, -box.min.y * s, -ctr.z * s);
  root.updateMatrixWorld(true);
}
function makeCamera(elevDeg) {
  /* 정사영: 키 1 유닛이 셀 높이의 78%를 차지하도록 */
  const h = 1 / .62, cam = new THREE.OrthographicCamera(-h / 2, h / 2, h / 2, -h / 2, .01, 50); /* 키 1유닛 ≈ 셀의 62% — 치켜든 무기까지 여백 확보 */
  const el = elevDeg * Math.PI / 180, d = 10;
  cam.position.set(0, Math.sin(el) * d, Math.cos(el) * d);
  cam.lookAt(0, 0, 0);
  /* 타깃 y=0.57: 정사영에서 발(y=0)이 셀의 약 90% 높이에, 머리/무기 끝은 위 20% 여백 안에 들어온다
     (view_y = (y - ty)·cos(el) → 발 오프셋 .57·.9/1.28 ≈ 셀의 40% 아래) */
  const ty = .61; /* 실측 보정: ty↑ = 모델이 아래로. h=1/.62 에서 발끝 ≈ 셀 92%, 머리/무기 끝 ≈ 17% */
  cam.position.y += ty;
  cam.lookAt(0, ty, 0);
  cam.updateProjectionMatrix();
  return cam;
}
function bakeOne(root, FR, elev, yawFix) {
  renderer.setSize(FR, FR, false);
  const cam = makeCamera(elev);
  const sheet = document.createElement('canvas'); sheet.width = FR * 8; sheet.height = FR;
  const sc = sheet.getContext('2d');
  let topMin = FR, botMax = 0;
  for (let d = 0; d < 8; d++) {
    /* 게임의 face 각도 φ(0=오른쪽, π/2=아래(화면 앞)) → 모델 전방(-Z)이 그 화면 방향을 보도록 yaw */
    const phi = d * Math.PI / 4;
    root.rotation.y = Math.atan2(-Math.cos(phi), -Math.sin(phi)) + yawFix * Math.PI / 180;
    renderer.render(scene, cam);
    sc.drawImage(renderer.domElement, d * FR, 0);
    /* 알파 스캔: 머리 꼭대기/발끝 */
    const px = sc.getImageData(d * FR, 0, FR, FR).data;
    outer: for (let y = 0; y < FR; y++) for (let x = 0; x < FR; x += 2) if (px[(y * FR + x) * 4 + 3] > 30) { topMin = Math.min(topMin, y); break outer; }
    outer2: for (let y = FR - 1; y >= 0; y--) for (let x = 0; x < FR; x += 2) if (px[(y * FR + x) * 4 + 3] > 30) { botMax = Math.max(botMax, y); break outer2; }
  }
  return { sheet, meta: { fr: FR, dirs: 8, top: topMin, feet: botMax, elev, yawFix } };
}
async function loadGlb(url) {
  return new Promise((res, rej) => loader.load(url, g => res({ scene: g.scene, animations: g.animations || [] }), undefined, rej));
}
/* 애니메이션 모델 베이크: 상태별 프레임을 행(row)으로, 8방향을 열(col)로 */
function bakeAnimated(root, animations, FR, elev, yawFix, animMap) {
  renderer.setSize(FR, FR, false);
  const cam = makeCamera(elev);
  const mixer = new THREE.AnimationMixer(root);
  const states = {};
  const plan = [];
  for (const st of ANIM_ORDER) {
    const re = animMap[st]; if (!re) continue;
    const clip = animations.find(c => re.test(c.name));
    if (!clip) { log(`  · ${st}: 클립 없음 (${re})`); continue; }
    const n = ANIM_FRAMES[st] || 4;
    states[st] = { row: plan.length, n, clip: clip.name };
    for (let i = 0; i < n; i++) plan.push({ st, clip, t: st === 'death' ? clip.duration * (i / Math.max(1, n - 1)) * .98 : clip.duration * (i / n) });
  }
  const rows = plan.length;
  const sheet = document.createElement('canvas'); sheet.width = FR * 8; sheet.height = FR * rows;
  const sc = sheet.getContext('2d');
  let topMin = FR, botMax = 0;
  let action = null;
  for (let r = 0; r < rows; r++) {
    const { clip, t } = plan[r];
    if (!action || action.getClip() !== clip) { mixer.stopAllAction(); action = mixer.clipAction(clip); action.play(); }
    mixer.setTime(t);
    root.updateMatrixWorld(true);
    for (let d = 0; d < 8; d++) {
      const phi = d * Math.PI / 4;
      root.rotation.y = Math.atan2(-Math.cos(phi), -Math.sin(phi)) + yawFix * Math.PI / 180;
      renderer.render(scene, cam);
      sc.drawImage(renderer.domElement, d * FR, r * FR);
      if (plan[r].st === 'idle') { /* 알파 스캔은 대기 프레임 기준 */
        const px = sc.getImageData(d * FR, r * FR, FR, FR).data;
        outer: for (let y = 0; y < FR; y++) for (let x = 0; x < FR; x += 2) if (px[(y * FR + x) * 4 + 3] > 30) { topMin = Math.min(topMin, y); break outer; }
        outer2: for (let y = FR - 1; y >= 0; y--) for (let x = 0; x < FR; x += 2) if (px[(y * FR + x) * 4 + 3] > 30) { botMax = Math.max(botMax, y); break outer2; }
      }
    }
  }
  mixer.stopAllAction();
  return { sheet, meta: { fr: FR, dirs: 8, rows, top: topMin, feet: botMax, elev, yawFix, states: Object.fromEntries(Object.entries(states).map(([k, v]) => [k, { row: v.row, n: v.n, clip: v.clip }])) } };
}
async function run(onlyFirst) {
  const FR = +$('fr').value || 512, elev = +$('elev').value || 26, yawFix = +$('yawFix').value || 0, hs = +$('hscale').value || 1;
  $('out').innerHTML = '';
  for (const job of (onlyFirst ? JOBS.slice(0, 1) : JOBS)) {
    const isObj = !Array.isArray(job);
    const url = isObj ? job.url : job[0], name = isObj ? job.key : job[1], yawExtra = isObj ? (job.yaw || 0) : (job[2] || 0);
    const frJob = isObj && job.fr ? job.fr : FR, hsJob = isObj && job.hscale ? job.hscale : hs;
    $('st').textContent = `로딩: ${name}`;
    const t0 = performance.now();
    let g;
    try { g = await loadGlb(url); } catch (e) { log(`✗ ${name} 로드 실패: ${e.message || e}`); continue; }
    const root = g.scene;
    if (isObj && job.anim) { /* 리깅 모델: 대기 포즈 기준으로 정규화 (스킨 포함 정밀 bbox) */
      const mx = new THREE.AnimationMixer(root); const idleClip = g.animations.find(c => job.anim.idle.test(c.name)) || g.animations[0];
      if (idleClip) { mx.clipAction(idleClip).play(); mx.setTime(0); root.updateMatrixWorld(true); }
      const box = new THREE.Box3().setFromObject(root, true);
      const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
      const sN = (1 / size.y) * hsJob;
      root.scale.setScalar(sN); root.position.set(-ctr.x * sN, -box.min.y * sN, -ctr.z * sN); root.updateMatrixWorld(true);
      mx.stopAllAction();
    } else normalize(root, hsJob);
    scene.add(root);
    const { sheet, meta } = (isObj && job.anim) ? bakeAnimated(root, g.animations, frJob, elev, yawFix + yawExtra, job.anim) : bakeOne(root, frJob, elev, yawFix + yawExtra);
    scene.remove(root);
    root.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    meta.name = name; meta.src = url.split('/').pop();
    const img = document.createElement('img'); img.className = 'sheet'; img.src = sheet.toDataURL('image/png'); img.title = name;
    $('out').appendChild(img);
    log(`✓ ${name}: ${(performance.now() - t0 | 0)}ms  top=${meta.top} feet=${meta.feet} (셀 ${meta.fr}${meta.rows ? ', 행 ' + meta.rows + ' ' + Object.keys(meta.states).join('/') : ''})`);
    if (!onlyFirst) {
      try {
        const r = await fetch(SAVE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, png: img.src, meta }) });
        log(r.ok ? `  → assets/sprites/${name}.png 저장` : `  ✗ 저장 실패 ${r.status}`);
      } catch (e) { log(`  ✗ 저장 서버(8124) 연결 실패 — python3 tools/bake_server.py 실행 필요`); }
    }
  }
  $('st').textContent = '완료';
  window.__bakeDone = true;
}
$('run').onclick = () => run(false);
$('one').onclick = () => run(true);
window.__bake = run;
log('준비됨. GLB 4개 · three ' + THREE.REVISION);
</script>
</body></html>
